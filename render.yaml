services:
  - type: web
    name: anveshan-research-lab
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANVESHAN_ENV
        value: production
      - key: ANVESHAN_DB_PATH
        value: /tmp/anveshan.db
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENALEX_EMAIL
        sync: false
